<style>.mermaid{margin:1.5em 0;text-align:center;background:#fff}</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  document.addEventListener("DOMContentLoaded", async () => {
    // kramdown/rouge emits ```mermaid fences as <div class="language-mermaid highlighter-rouge"><div class="highlight"><pre><code>
    document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((el) => {
      const src = el.textContent;
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = src;
      const target = el.tagName === "CODE" ? el.parentElement : el;
      target.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" });
    await mermaid.run({ querySelector: ".mermaid" });
  });
</script>
